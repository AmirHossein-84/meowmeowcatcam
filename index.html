<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gesture Meme Detector</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .split {
    display: flex;
    width: 100vw;
    height: 100vh;
  }
  .pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>
  <div class="split">
    <div class="pane"><video id="video" playsinline muted autoplay></video></div>
    <div class="pane"><img id="memeImg" src="memes/pokercat.jpg" alt="" /></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
